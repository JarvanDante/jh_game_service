apiVersion: v1
kind: Service
metadata:
  name: jh-game-service
  namespace: jh-test
  labels:
    app: jh-game-service
    env: test
spec:
  selector:
    app: jh-game-service
  ports:
    - name: grpc
      port: 8005
      targetPort: grpc
---
apiVersion: v1
kind: Service
metadata:
  name: consul
  namespace: jh-test
spec:
  type: ExternalName
  externalName: host.docker.internal
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: jh-test
spec:
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: jaeger
  namespace: jh-test
  labels:
    kubernetes.io/service-name: jaeger
addressType: IPv4
ports:
  - name: otlp-grpc
    port: 4317
    protocol: TCP
endpoints:
  - addresses:
      - 192.168.65.254
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: jh-test
spec:
  type: ExternalName
  externalName: host.docker.internal
---
apiVersion: v1
kind: Service
metadata:
  name: clickhouse
  namespace: jh-test
spec:
  ports:
    - name: native
      port: 9000
      targetPort: 9081
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: clickhouse
  namespace: jh-test
  labels:
    kubernetes.io/service-name: clickhouse
addressType: IPv4
ports:
  - name: native
    port: 9081
    protocol: TCP
endpoints:
  - addresses:
      - 192.168.65.254
---
